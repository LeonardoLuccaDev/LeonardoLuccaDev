<svg xmlns="http://www.w3.org/2000/svg" width="280" height="150" viewBox="0 0 280 150"><style>@keyframes flash{0%{fill-opacity:0}40%{fill-opacity:.55}100%{fill-opacity:.08}}@keyframes burst{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}@keyframes rise{from{opacity:.25}to{opacity:1}}@keyframes wobble{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-14deg)}92%{transform:rotate(12deg)}95%{transform:rotate(-8deg)}98%{transform:rotate(4deg)}}.box{animation:flash .9s ease-out 0.95s both}.burst{transform-box:fill-box;transform-origin:center;opacity:0;animation:burst .8s ease-out 0.95s both}.chk{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out 1.40s both}.txt{animation:rise .6s ease-out 0.95s both}.lock{transform-box:fill-box;transform-origin:50% 0;animation:wobble 4s ease-in-out 1.5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="1" y="1" width="278" height="148" rx="8" fill="#0A0F1E" stroke="#39FF14" stroke-opacity=".45"/><rect x="1" y="18" width="3" height="114" fill="#39FF14"/><g opacity="1"><rect class="box" x="22" y="20" width="52" height="52" rx="6" fill="#39FF14" fill-opacity=".08" stroke="#39FF14" stroke-opacity=".7"/><text x="48" y="52" fill="#39FF14" font-family="JetBrains Mono,Consolas,SFMono-Regular,Menlo,DejaVu Sans Mono,monospace" font-size="18" font-weight="700" text-anchor="middle" textLength="22" lengthAdjust="spacingAndGlyphs">PY</text><g class="txt"><text x="22" y="98" fill="#E1E4FA" font-family="JetBrains Mono,Consolas,SFMono-Regular,Menlo,DejaVu Sans Mono,monospace" font-size="12.5" font-weight="700" text-anchor="start" textLength="142" lengthAdjust="spacingAndGlyphs">MESTRE DA AUTOMAÇÃO</text><text x="22" y="120" fill="#A6AABF" font-family="Segoe UI,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5">~30 automações Python em produção</text></g></g><rect class="burst" x="22" y="20" width="52" height="52" rx="6" fill="none" stroke="#39FF14" stroke-width="2"/><g class="chk"><text x="258" y="36" fill="#39FF14" font-family="JetBrains Mono,Consolas,SFMono-Regular,Menlo,DejaVu Sans Mono,monospace" font-size="14" font-weight="700" text-anchor="end">✓</text></g></svg>